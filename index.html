<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="可搜索、可编辑的办公室工位图，适合部署到 GitHub Pages。" />
  <title>办公室工位图</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">OFFICE DIRECTORY</p>
      <h1>办公室工位图</h1>
    </div>
    <div class="actions">
      <label class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="搜索同事姓名…" autocomplete="off" />
      </label>
      <button id="editToggle" class="button" type="button">编辑工位</button>
      <button id="exportBtn" class="button ghost" type="button">导出数据</button>
    </div>
  </header>

  <main>
    <section class="map-card" aria-label="办公室平面图">
      <div class="map-head">
        <div>
          <h2>工位分布</h2>
          <p>点击姓名查看位置；开启编辑后可修改姓名。</p>
        </div>
        <div class="legend" aria-label="图例">
          <span><i class="dot occupied"></i>有人</span>
          <span><i class="dot open"></i>空位</span>
          <span><i class="dot selected"></i>已选中</span>
        </div>
      </div>

      <div class="viewport" tabindex="0" aria-label="可横向滚动的办公室地图">
        <div class="floor" id="floor">
          <div class="slant-wall" aria-hidden="true"></div>

          <section class="room eric-room" aria-label="Eric 办公室">
            <span class="room-label">独立办公室</span>
            <div class="sofa long"></div>
            <div class="sofa small"></div>
            <div class="desk manager"><span>Eric</span></div>
          </section>

          <section class="room top-meeting" aria-label="会议室">
            <span class="room-label">会议室 A</span>
            <div class="meeting-table compact"><i></i><i></i><i></i><i></i></div>
          </section>

          <div class="phone-booth">电话亭</div>
          <div class="entry-door" aria-label="入口"><span>入口</span></div>
          <div class="lounge-sofa" aria-label="休息区"></div>

          <section class="desk-group group-a" data-group="A"></section>
          <section class="desk-group group-b" data-group="B"></section>
          <section class="desk-group group-c" data-group="C"></section>
          <section class="desk-group group-d" data-group="D"></section>

          <section class="room side-room one" aria-label="小会议室 1">
            <span class="room-label">会议室 B</span><div class="meeting-table side"></div>
          </section>
          <section class="room side-room two" aria-label="小会议室 2">
            <span class="room-label">会议室 C</span><div class="meeting-table side"></div>
          </section>
          <section class="room utility" aria-label="茶水区">
            <span class="room-label">茶水区</span><div class="counter"></div>
          </section>
          <section class="room quiet" aria-label="休息室">
            <span class="room-label">休息室</span><div class="quiet-bed"></div>
          </section>
          <section class="room tracy-room" aria-label="Tracy 和 Cathy 办公室">
            <span class="room-label">独立办公室</span>
            <div class="dual-desk"><button class="seat mini" data-seat="R1"></button><button class="seat mini" data-seat="R2"></button></div>
          </section>

          <div class="plants" aria-label="绿植区"></div>
          <div class="collab-table" aria-label="协作桌"><span>协作区</span></div>
        </div>
      </div>
    </section>

    <aside class="info-panel" id="infoPanel" aria-live="polite">
      <div>
        <p class="eyebrow">SEAT DETAILS</p>
        <h2 id="personName">选择一个工位</h2>
        <p id="seatMeta">搜索姓名，或直接点击地图上的工位。</p>
      </div>
      <button id="clearBtn" class="text-button" type="button" disabled>清除选择</button>
    </aside>
  </main>

  <dialog id="editDialog">
    <form method="dialog" id="editForm">
      <p class="eyebrow">EDIT SEAT</p>
      <h2>修改工位姓名</h2>
      <p id="editSeatLabel"></p>
      <label>姓名<input id="editName" maxlength="30" /></label>
      <div class="dialog-actions">
        <button class="button ghost" value="cancel">取消</button>
        <button class="button" id="saveName" value="default">保存</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
