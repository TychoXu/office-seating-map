<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Office Seating Map</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div><small data-i18n="eyebrow">OFFICE DIRECTORY</small><h1 data-i18n="pageTitle">Office Seating Map</h1></div><div class="toolbar"><label>⌕ <input id="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search names…"></label><button id="languageToggle" class="secondary" type="button">中文</button><button id="edit" data-i18n="editSeats">Edit seats</button><button id="export" class="secondary" data-i18n="exportJson">Export JSON</button><button id="exportPng" class="secondary" data-i18n="exportPng">Export PNG</button><button id="exportPdf" class="secondary" data-i18n="exportPdf">Export PDF</button></div></header>

</g>

<aside class="detail"><small data-i18n="seatDetails">SEAT DETAILS</small><h2 id="person" data-i18n="selectSeat">Select a seat</h2><p id="alternateName" data-i18n="detailsHint">Click a person on the map to view details.</p><dl id="personDetails" hidden><div><dt data-i18n="englishName">English name</dt><dd id="englishFull"></dd></div><div><dt data-i18n="department">Department</dt><dd id="department"></dd></div><div><dt data-i18n="jobTitle">Job title</dt><dd id="title"></dd></div><div><dt data-i18n="seat">Seat</dt><dd id="meta"></dd></div></dl><button id="clear" class="link" disabled data-i18n="clearSelection">Clear selection</button></aside></main>
<dialog id="dialog"><form method="dialog" id="form"><small data-i18n="editSeatEyebrow">EDIT SEAT</small><h2 data-i18n="editSeatName">Edit seat name</h2><p id="seatId"></p><label><span data-i18n="name">Name</span><input id="name" maxlength="30"></label><div><button value="cancel" class="secondary" data-i18n="cancel">Cancel</button><button value="default" data-i18n="save">Save</button></div></form></dialog>
<script src="people.js"></script><script src="i18n.js"></script><script src="app.js"></script><script src="export.js"></script></body></html>
